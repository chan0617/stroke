<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stroke — 스티커 엣지 정리 & 4K 업스케일</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f4f5f7;
    color: #1a1a2e;
    min-height: 100vh;
  }

  header {
    background: #1a1a2e;
    color: #fff;
    padding: 20px 32px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.5px; }
  header span { font-size: 0.8rem; color: #aab; }

  main { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }

  /* Upload zone */
  #drop-zone {
    border: 2.5px dashed #c0c4cc;
    border-radius: 16px;
    background: #fff;
    padding: 48px 24px;
    text-align: center;
    cursor: pointer;
    transition: border-color .2s, background .2s;
  }
  #drop-zone.over { border-color: #4f6ef7; background: #f0f4ff; }
  #drop-zone .icon { font-size: 3rem; margin-bottom: 12px; }
  #drop-zone p    { color: #666; font-size: 0.95rem; }
  #drop-zone b    { color: #4f6ef7; }
  #file-input { display: none; }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 10px 22px; border-radius: 8px; border: none;
    font-size: 0.95rem; font-weight: 600; cursor: pointer;
    transition: opacity .15s, transform .1s;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: #4f6ef7; color: #fff; }
  .btn-primary:disabled { opacity: .45; cursor: not-allowed; }
  .btn-dl { background: #1a1a2e; color: #fff; font-size: 0.85rem; padding: 8px 16px; }
  .btn-dl:disabled { opacity: .3; cursor: not-allowed; }

  #process-wrap {
    display: flex; align-items: center; gap: 16px;
    margin-top: 20px;
  }
  #progress-wrap {
    display: none; flex: 1;
    background: #e8eaf0; border-radius: 999px; height: 8px; overflow: hidden;
  }
  #progress-bar {
    height: 100%; width: 0%; background: #4f6ef7;
    border-radius: 999px; transition: width .25s ease;
  }
  #status-msg { font-size: 0.85rem; color: #666; min-width: 160px; }

  /* Results */
  #results { display: none; margin-top: 40px; }
  #results > h2 { font-size: 1rem; font-weight: 700; margin-bottom: 18px; color: #444; }

  .result-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
  }
  @media (max-width: 640px) { .result-grid { grid-template-columns: 1fr; } }

  .result-card {
    background: #fff; border-radius: 14px;
    overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,.07);
  }
  .card-title {
    padding: 14px 18px 0;
    font-size: 0.9rem; font-weight: 700; color: #1a1a2e;
  }
  .canvas-wrap {
    background-image:
      linear-gradient(45deg, #ccc 25%, transparent 25%),
      linear-gradient(-45deg, #ccc 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #ccc 75%),
      linear-gradient(-45deg, transparent 75%, #ccc 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, -8px 0;
    background-color: #e8e8e8;
    display: flex; align-items: center; justify-content: center;
    min-height: 220px; padding: 12px;
    margin-top: 12px;
  }
  .result-card canvas { max-width: 100%; max-height: 340px; border-radius: 4px; }
  .result-footer {
    padding: 12px 18px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; flex-wrap: wrap;
  }
  .result-info { font-size: 0.78rem; color: #888; }
</style>
</head>
<body>

<header>
  <h1>✏ Stroke</h1>
  <span>스티커 엣지 정리 &amp; 4K 업스케일 — 100% 브라우저 처리 · 외부 API 없음 · 무료</span>
</header>

<main>

  <div id="drop-zone">
    <div class="icon">🖼️</div>
    <p><b>PNG 파일을 드래그</b>하거나 클릭해서 업로드</p>
    <p style="margin-top:6px;font-size:.82rem;color:#aaa">투명 배경(RGBA) PNG 스티커</p>
    <input type="file" id="file-input" accept=".png,image/png">
  </div>

  <div id="process-wrap">
    <button class="btn btn-primary" id="process-btn" disabled>⚡ 처리 시작</button>
    <div id="progress-wrap">
      <div id="progress-bar"></div>
    </div>
    <span id="status-msg"></span>
  </div>

  <section id="results">
    <h2>결과</h2>
    <div class="result-grid">

      <div class="result-card">
        <div class="card-title">정리된 스티커 (아웃라인 적용)</div>
        <div class="canvas-wrap"><canvas id="canvas-cleaned"></canvas></div>
        <div class="result-footer">
          <span class="result-info" id="info-cleaned">—</span>
          <button class="btn btn-dl" id="dl-cleaned" disabled>⬇ 다운로드</button>
        </div>
      </div>

      <div class="result-card">
        <div class="card-title">4K 업스케일</div>
        <div class="canvas-wrap"><canvas id="canvas-4k"></canvas></div>
        <div class="result-footer">
          <span class="result-info" id="info-4k">—</span>
          <button class="btn btn-dl" id="dl-4k" disabled>⬇ 다운로드</button>
        </div>
      </div>

    </div>
  </section>

</main>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   IMAGE PROCESSING
   100% local — Canvas API only. No network requests. No API keys. No fees.
   ═══════════════════════════════════════════════════════════════════════════ */

function setProgress(pct, msg) {
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('status-msg').textContent = msg;
}

function tick() { return new Promise(r => setTimeout(r, 20)); }

// ── 1. Remove green (#00FF7F) colour fringe ─────────────────────────────────
function removeFringe(imageData) {
  const d = new Uint8ClampedArray(imageData.data);
  for (let i = 0; i < d.length; i += 4) {
    const r = d[i], g = d[i+1], b = d[i+2], a = d[i+3];
    if (a === 0) continue;
    const maxRB  = Math.max(r, b);
    const excess = Math.max(0, g - maxRB);
    if (excess === 0) continue;
    const isEdge = a > 1 && a < 240;
    const despill = Math.min(excess / 128, 1);
    d[i+1] = Math.round(g - excess * (isEdge ? despill : 0.4));
    if (isEdge && g > 180 && g > r * 1.8 && g > b * 1.4) {
      d[i+3] = Math.round(a * (1 - Math.min(excess / 200, 1) * 0.85));
    }
  }
  return new ImageData(d, imageData.width, imageData.height);
}

// ── 2. Smooth jagged alpha (box blur on alpha channel only) ─────────────────
function smoothAlpha(imageData) {
  const { width: w, height: h, data } = imageData;
  const out = new Uint8ClampedArray(data);
  const R = 1;
  for (let y = R; y < h - R; y++) {
    for (let x = R; x < w - R; x++) {
      const a = data[(y * w + x) * 4 + 3];
      if (a === 0 || a === 255) continue;
      let sum = 0, cnt = 0;
      for (let dy = -R; dy <= R; dy++)
        for (let dx = -R; dx <= R; dx++) {
          sum += data[((y+dy)*w+(x+dx))*4+3];
          cnt++;
        }
      out[(y * w + x) * 4 + 3] = Math.round(sum / cnt);
    }
  }
  return new ImageData(out, w, h);
}

// ── 3. Outline: dilate binary mask, paint black → white → character ─────────
function dilateMask(binary, w, h, radius) {
  const r   = Math.ceil(radius);
  const out = new Uint8Array(w * h);
  // Circular kernel offsets (precomputed)
  const offs = [];
  for (let dy = -r; dy <= r; dy++)
    for (let dx = -r; dx <= r; dx++)
      if (dx*dx + dy*dy <= radius * radius + 0.5)
        offs.push(dy * w + dx);

  for (let y = r; y < h - r; y++) {
    for (let x = r; x < w - r; x++) {
      const idx = y * w + x;
      if (binary[idx]) { out[idx] = 1; continue; }
      for (const off of offs)
        if (binary[idx + off]) { out[idx] = 1; break; }
    }
  }
  // Borders: copy binary directly
  for (let i = 0; i < w * h; i++)
    if (binary[i]) out[i] = 1;
  return out;
}

function addOutline(imageData, whitePx = 2.0, blackPx = 1.5) {
  const { width: w, height: h, data } = imageData;
  const totalPx = whitePx + blackPx;

  const binary = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++)
    binary[i] = data[i * 4 + 3] > 30 ? 1 : 0;

  const blackDil = dilateMask(binary, w, h, totalPx);
  const whiteDil = dilateMask(binary, w, h, whitePx);

  const out = new Uint8ClampedArray(w * h * 4);

  for (let i = 0; i < w * h; i++) {
    const p = i * 4;
    if (binary[i]) {
      out[p] = data[p]; out[p+1] = data[p+1];
      out[p+2] = data[p+2]; out[p+3] = data[p+3];
    } else if (whiteDil[i]) {
      out[p] = out[p+1] = out[p+2] = 255; out[p+3] = 255;
    } else if (blackDil[i]) {
      out[p] = out[p+1] = out[p+2] = 0; out[p+3] = 255;
    }
  }
  return new ImageData(out, w, h);
}

// ── 4. 4K upscale via canvas (hardware-accelerated) ─────────────────────────
function upscaleTo4K(imageData) {
  const { width, height } = imageData;
  const MAX = 3840;
  if (Math.max(width, height) >= MAX) return imageData;

  const scale = MAX / Math.max(width, height);
  const nw = Math.round(width * scale);
  const nh = Math.round(height * scale);

  const src = document.createElement('canvas');
  src.width = width; src.height = height;
  src.getContext('2d').putImageData(imageData, 0, 0);

  const dst = document.createElement('canvas');
  dst.width = nw; dst.height = nh;
  const ctx = dst.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(src, 0, 0, nw, nh);
  return ctx.getImageData(0, 0, nw, nh);
}

// ── 5. Sharpen (3×3 unsharp — skipped for very large images) ────────────────
function sharpen(imageData) {
  const { width: w, height: h, data } = imageData;
  if (w > 1500) return imageData; // skip on 4K — already sharp from LANCZOS-quality canvas
  const out = new Uint8ClampedArray(data);
  const k = [0, -0.25, 0, -0.25, 2, -0.25, 0, -0.25, 0];
  for (let y = 1; y < h-1; y++)
    for (let x = 1; x < w-1; x++) {
      const p = (y * w + x) * 4;
      if (data[p+3] < 10) continue;
      for (let c = 0; c < 3; c++) {
        let v = 0;
        for (let ky = -1; ky <= 1; ky++)
          for (let kx = -1; kx <= 1; kx++)
            v += data[((y+ky)*w+(x+kx))*4+c] * k[(ky+1)*3+(kx+1)];
        out[p+c] = Math.max(0, Math.min(255, v));
      }
    }
  return new ImageData(out, w, h);
}

// ── Download helper ─────────────────────────────────────────────────────────
function downloadCanvas(canvas, filename) {
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = filename;
  a.click();
}

function sizeInfo(imageData) {
  return `${imageData.width} × ${imageData.height} px`;
}

/* ═══════════════════════════════════════════════════════════════════════════
   FULL PIPELINE
   ═══════════════════════════════════════════════════════════════════════════ */
async function runPipeline(file) {
  const btn = document.getElementById('process-btn');
  btn.disabled = true;
  document.getElementById('progress-wrap').style.display = 'flex';

  let t0 = Date.now();

  try {
    setProgress(5, '이미지 로딩…');
    await tick();

    const bitmap = await createImageBitmap(file);
    const tmp = document.createElement('canvas');
    tmp.width = bitmap.width; tmp.height = bitmap.height;
    tmp.getContext('2d').drawImage(bitmap, 0, 0);
    let id = tmp.getContext('2d').getImageData(0, 0, tmp.width, tmp.height);

    setProgress(18, '컬러 프린지 제거…');
    await tick();
    id = removeFringe(id);

    setProgress(32, '알파 엣지 스무딩…');
    await tick();
    id = smoothAlpha(id);

    setProgress(50, '아웃라인 추가 중…');
    await tick();
    id = addOutline(id, 2.0, 1.5);

    // Show cleaned result
    const cc = document.getElementById('canvas-cleaned');
    cc.width = id.width; cc.height = id.height;
    cc.getContext('2d').putImageData(id, 0, 0);
    document.getElementById('info-cleaned').textContent = sizeInfo(id);

    setProgress(68, '4K 업스케일…');
    await tick();
    let id4k = upscaleTo4K(id);

    setProgress(88, '샤프닝…');
    await tick();
    id4k = sharpen(id4k);

    // Show 4K result
    const c4k = document.getElementById('canvas-4k');
    c4k.width = id4k.width; c4k.height = id4k.height;
    c4k.getContext('2d').putImageData(id4k, 0, 0);

    const elapsed = ((Date.now() - t0) / 1000).toFixed(1);
    document.getElementById('info-4k').textContent =
      `${sizeInfo(id4k)}  |  ${elapsed}s`;

    setProgress(100, `완료! (${elapsed}s)`);

    // Wire download buttons
    const base = file.name.replace(/\.png$/i, '');
    const dlC = document.getElementById('dl-cleaned');
    const dl4 = document.getElementById('dl-4k');
    dlC.disabled = dl4.disabled = false;
    dlC.onclick = () => downloadCanvas(cc,  `${base}_cleaned.png`);
    dl4.onclick = () => downloadCanvas(c4k, `${base}_4k.png`);

    document.getElementById('results').style.display = 'block';
    document.getElementById('results').scrollIntoView({ behavior: 'smooth' });

  } catch (err) {
    setProgress(0, '오류: ' + err.message);
    console.error(err);
  } finally {
    btn.disabled = false;
  }
}

/* ═══════════════════════════════════════════════════════════════════════════
   UI WIRING
   ═══════════════════════════════════════════════════════════════════════════ */
let selectedFile = null;

const dropZone   = document.getElementById('drop-zone');
const fileInput  = document.getElementById('file-input');
const processBtn = document.getElementById('process-btn');

dropZone.addEventListener('click',     () => fileInput.click());
dropZone.addEventListener('dragover',  e  => { e.preventDefault(); dropZone.classList.add('over'); });
dropZone.addEventListener('dragleave', ()  => dropZone.classList.remove('over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('over');
  const f = e.dataTransfer.files[0];
  if (f && f.type === 'image/png') selectFile(f);
  else alert('PNG 파일만 지원합니다.');
});
fileInput.addEventListener('change', () => { if (fileInput.files[0]) selectFile(fileInput.files[0]); });

function selectFile(f) {
  selectedFile = f;
  dropZone.querySelector('p').innerHTML =
    `<b>${f.name}</b> (${(f.size/1024).toFixed(0)} KB) — 준비 완료`;
  processBtn.disabled = false;
}

processBtn.addEventListener('click', () => {
  if (selectedFile) runPipeline(selectedFile);
});
</script>
</body>
</html>
